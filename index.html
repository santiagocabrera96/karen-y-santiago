<script>
const codigo = new URLSearchParams(window.location.search).get('i') ?? '';
const textoCodigo = /^([0-9A-Fa-f]{4})+$/.test(codigo) ? codigo.match(/.{4}/g).map((h) => String.fromCharCode(parseInt(h, 16))).join('') : '';
const [pasesCodigo = '', ...nombresCodigo] = textoCodigo.split('|');
const pases = /^\d{1,3}$/.test(pasesCodigo.trim()) ? Number(pasesCodigo.trim()) : 0;
const nombres = nombresCodigo.map((nombre) => nombre.trim().slice(0, 60).toLocaleLowerCase('es').split(/\s+/)
.map((palabra, i) => (i > 0 && ['de', 'del', 'la', 'las', 'los', 'y', 'e'].includes(palabra)) ? palabra : palabra.charAt(0).toLocaleUpperCase('es') + palabra.slice(1))
.join(' ')).filter(Boolean).slice(0, 8);
const plural = pases > 1 || (pases !== 1 && nombres.length > 1);
document.getElementById('nombres').textContent = nombres.join('\n') || '[Nombre del invitado]';
document.getElementById('pista').textContent = plural ? 'Toquen el sobre para abrir' : 'Toca el sobre para abrir';
document.getElementById('abrir').search = window.location.search;
</script>
