<html lang="es"><head>

<title>Invitación de Matrimonio · Karen &amp; Santiago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bg-satin{background:#F4EDE3 url("fondo-satin.jpg") repeat center top/450px auto}
.bg-cover{background:linear-gradient(to bottom,rgba(244,237,227,0) 82%,rgba(244,237,227,0.85) 96%,#F4EDE3 100%),#F4EDE3 url("fondo-portada.jpg") no-repeat center top/cover}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
#abrir{display:block;margin:-20px;animation:latido 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
#abrir:focus-visible{outline:2px solid #4A1420;outline-offset:4px}
</style>
</head>
<body>
<div style="width: 100%; min-height: 100vh; background: #EAE2D7; color: #111111; font-family: 'Playfair Display', Georgia, serif; font-size: 15px; line-height: 1.5">
<div class="bg-satin" style="position: relative; max-width: 480px; margin: 0 auto; overflow: hidden">
<section class="bg-cover" style="position: relative; min-height: 100vh; box-sizing: border-box; padding: 110px 24px 56px; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden">
<img src="monograma.png" alt="Monograma KS" style="width: 170px; height: auto; display: block">
<p style="margin: 18px 0 0; font-family: 'Pinyon Script', cursive; font-size: 46px; line-height: 1.1; color: #4A1420">Karen &amp; Santiago</p>
<p style="margin: 14px 0 0; font-size: 26px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #4A1420">6 de febrero de 2027</p>
<div style="margin-top: 56px; display: flex; flex-direction: column; align-items: center; gap: 16px">
<a id="abrir" href="invitacion.html" aria-label="Abrir la invitación" onclick="this.search = window.location.search"><img src="sobre-cerrado.png" alt="Sobre de papel con sello de cera burgundy con monograma KS dorado" style="display: block; width: 340px; max-width: calc(100vw - 8px); height: auto"></a>
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Invitación para:</p>
</div>
<p id="nombres" style="margin: 24px auto 0; max-width: 100%; font-style: italic; font-weight: 400; font-size: 32px; line-height: 1.1; text-shadow: 0 0 10px #F4EDE3, 0 0 18px #F4EDE3; white-space: pre-line"></p>
<p id="pista" style="margin: 28px 0 0; font-size: 13px; font-style: italic; color: #5A3A3E">Toca el sobre para abrir</p>
</section>
</div>
</div>
<script>
const codigo = new URLSearchParams(window.location.search).get('i') ?? '';
const textoCodigo = /^([0-9A-Fa-f]{4})+$/.test(codigo) ? codigo.match(/.{4}/g).map((h) => String.fromCharCode(parseInt(h, 16))).join('') : '';
const [pasesCodigo = '', ...nombresCodigo] = textoCodigo.split('|');
const pases = /^\d{1,3}$/.test(pasesCodigo.trim()) ? Number(pasesCodigo.trim()) : 0;
const nombres = nombresCodigo.map((nombre) => nombre.trim().slice(0, 60).toLocaleLowerCase('es').split(/\s+/)
.map((palabra, i) => (i > 0 && ['de', 'del', 'la', 'las', 'los', 'y', 'e'].includes(palabra)) ? palabra : palabra.charAt(0).toLocaleUpperCase('es') + palabra.slice(1))
.join(' ')).filter(Boolean).slice(0, 8);
const plural = pases > 1 || (pases !== 1 && nombres.length > 1);
document.getElementById('nombres').textContent = nombres.join('\n') || '[Nombre del invitado]';
document.getElementById('pista').textContent = plural ? 'Toquen el sobre para abrir' : 'Toca el sobre para abrir';
document.getElementById('abrir').search = window.location.search;
</script>
</body></html>
